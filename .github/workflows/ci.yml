# CI pipeline (Continuous Integration)
# Purpose: prove every change is safe BEFORE it can be released.
# Runs on: pushes to 'develop' and on pull requests. Also reused by cd.yml as a gate.
# Jobs run in order: test -> docker. If 'test' fails, 'docker' never starts.

name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_call:          # lets cd.yml reuse this exact pipeline as a gate

permissions:
  contents: read

jobs:
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (flake8)
        run: flake8 app tests
      - name: Unit tests (pytest)
        run: pytest -v

  docker:
    name: Docker build + smoke test + vulnerability scan
    needs: test            # a failed test stops everything here
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION="$(cat VERSION)" \
            --build-arg GIT_SHA="${{ github.sha }}" \
            -t campus-pulse:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8000:8000 campus-pulse:ci
          sleep 5
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/version
          docker rm -f smoke
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.2.0
        with:
          image-ref: campus-pulse:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
